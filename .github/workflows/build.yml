name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (alt modüllerle)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Xcode sürümünü göster
        run: |
          xcodebuild -version
          xcodebuild -list -project GetMoreRam.xcodeproj

      - name: Swift paketlerini çöz
        run: |
          xcodebuild -resolvePackageDependencies \
            -project GetMoreRam.xcodeproj \
            -scheme GetMoreRam

      - name: Derle (imzasız)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project GetMoreRam.xcodeproj \
            -scheme GetMoreRam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/GetMoreRam.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: IPA oluştur
        run: |
          mkdir -p Payload
          cp -R build/GetMoreRam.xcarchive/Products/Applications/*.app Payload/
          zip -r GetMoreRam.ipa Payload

      - name: IPA'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: GetMoreRam-ipa
          path: GetMoreRam.ipa
