name: "iOS IPA Build"

on:
  push:
    branches: [ "main" ] # Hangi branch tetikleyecekse (main, master vb.)

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          BUILD_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "temporary_password"
        run: |
          # Keychain oluşturma ve sertifikayı içeri aktarma
          echo $BUILD_CERTIFICATE_BASE64 | base64 --decode --output app_dist.p12
          echo $BUILD_PROVISIONING_PROFILE_BASE64 | base64 --decode --output app_profile.mobileprovision
          
          xcrun security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          xcrun security default-keychain -s build.keychain
          xcrun security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          xcrun security import app_dist.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          xcrun security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          
          # Provisioning profile'ı yerine taşıma
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp app_profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Archive
        run: |
          xcodebuild -workspace ios/*.xcworkspace -scheme "YourSchemeName" -sdk iphoneos -configuration Release archive -archivePath $PWD/build/App.xcarchive
          # Not: Eğer saf native projeyse ios/ önekini kaldırıp direkt .xcodeproj/.xcworkspace adını yazın.

      - name: Export IPA
        env:
          EXPORT_OPTIONS_PLIST: ${{ secrets.EXPORT_OPTIONS_PLIST }}
        run: |
          # exportOptions.plist dosyasını oluşturun (AdHoc veya AppStore için)
          xcodebuild -exportArchive -archivePath $PWD/build/App.xcarchive -exportOptionsPlist exportOptions.plist -exportPath $PWD/build/out

      - name: Upload IPA Artifact
        uses: actions/actions-artifact@v3
        with:
          name: ios-app-ipa
          path: build/out/*.ipa
